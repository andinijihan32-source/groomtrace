<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROOMTRACE — Trace the Pattern, Not Just the Message.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F6EF; --ink:#23483A; --ink-soft:#4B6358; --accent:#7FA58E; --card:#E8F0EA;
  --line: rgba(35,72,58,0.14); --white:#FFFFFF;
  --warn:#B9793F; --warn-bg:#F3E6D6; --uncertain:#8C7F5A; --uncertain-bg:#EFE9D6;
  --danger:#A85248; --danger-bg:#F1DCD8;
  --font-display:'Fraunces',ui-serif,Georgia,serif; --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --radius-s:10px; --radius-m:16px; --radius-l:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#132720; --ink:#EDF3EF; --ink-soft:#B7C7BE; --accent:#8FBBA3; --card:#1C3A2F;
    --line: rgba(237,243,239,0.14); --white:#0F1F19;
    --warn:#E0A868; --warn-bg:#3A2C18; --uncertain:#CBB989; --uncertain-bg:#332E1C;
    --danger:#E0958A; --danger-bg:#3B211E;
  }
}
:root[data-theme="dark"]{
  --bg:#132720; --ink:#EDF3EF; --ink-soft:#B7C7BE; --accent:#8FBBA3; --card:#1C3A2F;
  --line: rgba(237,243,239,0.14); --white:#0F1F19;
  --warn:#E0A868; --warn-bg:#3A2C18; --uncertain:#CBB989; --uncertain-bg:#332E1C;
  --danger:#E0958A; --danger-bg:#3B211E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; line-height:1.15; letter-spacing:-0.01em;}
p{margin:0 0 1em;}
a{color:inherit;}
button{font-family:var(--font-body);}
::selection{background:var(--accent); color:var(--white);}
.wrap{max-width:760px; margin:0 auto; padding:0 24px;}
.wrap-wide{max-width:1040px; margin:0 auto; padding:0 24px;}

/* shell */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:230px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
  padding:28px 18px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{font-family:var(--font-display); font-size:1.35rem; font-weight:600; margin-bottom:4px;}
#sidebar .brand-tag{font-size:.78rem; color:var(--ink-soft); margin-bottom:28px; display:block; max-width:170px;}
#sidebar nav a{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-s);
  text-decoration:none; color:var(--ink-soft); font-size:.92rem; font-weight:500; margin-bottom:2px; cursor:pointer;
}
#sidebar nav a:hover{background:rgba(127,165,142,0.15); color:var(--ink);}
#sidebar nav a.active{background:var(--accent); color:var(--white);}
#sidebar nav .sep{height:1px; background:var(--line); margin:14px 0;}
#main{flex:1; min-width:0; padding:40px 0 100px;}
#topbar{display:none;}

@media (max-width: 880px){
  #sidebar{display:none;}
  #main{padding:24px 0 92px;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
    border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:20;
  }
  #topbar .brand{font-family:var(--font-display); font-weight:600; font-size:1.1rem;}
  #hamburger{background:none;border:none;font-size:1.4rem;color:var(--ink);cursor:pointer;padding:4px 8px;}
  #bottomnav{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card);
    border-top:1px solid var(--line); z-index:20; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  #bottomnav a{
    flex:1; text-align:center; font-size:.68rem; color:var(--ink-soft); text-decoration:none;
    padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border-radius:10px;
  }
  #bottomnav a.active{color:var(--accent);}
  #bottomnav .ic{font-size:1.15rem;}
  #drawer{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; display:none;
  }
  #drawer.open{display:block;}
  #drawer .panel{
    position:absolute; top:0; right:0; bottom:0; width:78%; max-width:300px; background:var(--card);
    padding:24px 18px; overflow-y:auto;
  }
  #drawer nav a{display:block; padding:12px 10px; border-radius:10px; color:var(--ink); text-decoration:none; font-weight:500;}
  #drawer nav a:hover{background:rgba(127,165,142,.15);}
}

/* generic */
.eyebrow{font-size:.82rem; color:var(--accent); font-weight:600; margin-bottom:8px;}
.btn{
  display:inline-flex; align-items:center; gap:8px; border:none; border-radius:999px; padding:12px 22px;
  font-weight:600; font-size:.95rem; cursor:pointer; background:var(--ink); color:var(--bg); transition:transform .12s ease, opacity .12s ease;
}
.btn:hover{opacity:.9;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn.accent{background:var(--accent); color:var(--white);}
.btn[disabled]{opacity:.4; cursor:not-allowed;}
.btn.small{padding:8px 16px; font-size:.85rem;}
.card{background:var(--card); border-radius:var(--radius-m); padding:22px;}
.card.white{background:var(--white); border:1px solid var(--line);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}
.pill{display:inline-block; padding:4px 12px; border-radius:999px; background:var(--card); font-size:.78rem; font-weight:600; color:var(--ink-soft);}
.muted{color:var(--ink-soft);}
.divider{height:1px; background:var(--line); margin:28px 0;}
input[type=text],input[type=password],textarea{
  width:100%; font-family:var(--font-body); font-size:.98rem; padding:12px 14px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--white); color:var(--ink);
}
textarea{resize:vertical; min-height:90px;}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
label.opt{
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); margin-bottom:8px; cursor:pointer; background:var(--white); font-size:.94rem;
}
label.opt:hover{border-color:var(--accent);}
label.opt.checked{border-color:var(--accent); background:var(--card);}
label.opt input{margin-top:3px;}
.progressbar{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
.progressbar > div{height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease;}
.skillrow{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.skillrow .label{width:96px; font-size:.85rem; font-weight:600; flex-shrink:0;}
.skillrow .bar{flex:1;}
.skillrow .val{width:38px; text-align:right; font-size:.82rem; color:var(--ink-soft); flex-shrink:0;}
.chatlog{display:flex; flex-direction:column; gap:14px;}
.daymark{display:flex; align-items:center; gap:10px; margin:14px 0 2px; font-size:.75rem; font-weight:700; color:var(--ink-soft); letter-spacing:.03em;}
.daymark::after{content:""; flex:1; height:1px; background:var(--line);}
.bubble{
  max-width:74%; padding:12px 16px; border-radius:18px; background:var(--white); border:1px solid var(--line); font-size:.95rem;
}
.bubble.self{align-self:flex-end; background:var(--card); border-color:var(--card);}
.bubble .who{font-size:.72rem; font-weight:700; color:var(--accent); margin-bottom:3px;}
.timelineitem{
  display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--white); margin-bottom:8px; cursor:pointer;
}
.timelineitem.sel{border-color:var(--accent); background:var(--card);}
.timelineitem .dot{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:.7rem;}
.timelineitem.sel .dot{background:var(--accent); border-color:var(--accent); color:var(--white);}
.tag{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--warn-bg); color:var(--warn);}
.tag.uncertain{background:var(--uncertain-bg); color:var(--uncertain);}
.feedbackbox{border-radius:var(--radius-m); padding:18px 20px; margin:16px 0;}
.feedbackbox.good{background:var(--card);}
.feedbackbox.note{background:var(--warn-bg);}
.hero{padding:64px 0 40px;}
.hero h1{font-size:clamp(2.1rem,5vw,3.1rem); max-width:680px;}
.hero .lede{font-size:1.15rem; color:var(--ink-soft); max-width:520px; margin-bottom:28px;}
.stepnum{
  width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--white); display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:.9rem; flex-shrink:0;
}
table{width:100%; border-collapse:collapse; font-size:.92rem;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
th{color:var(--ink-soft); font-weight:600; font-size:.8rem;}
.menu-tile{
  display:flex; flex-direction:column; gap:6px; padding:20px; border-radius:var(--radius-m); background:var(--white);
  border:1.5px solid var(--line); cursor:pointer; text-decoration:none; color:var(--ink);
}
.menu-tile:hover{border-color:var(--accent);}
.menu-tile .ic{font-size:1.5rem;}
.casecard{
  display:flex; gap:16px; padding:18px; border-radius:var(--radius-m); background:var(--white); border:1.5px solid var(--line);
  cursor:pointer; margin-bottom:12px; align-items:center;
}
.casecard:hover{border-color:var(--accent);}
.casecard .num{font-family:var(--font-display); font-size:1.6rem; color:var(--accent); width:44px; flex-shrink:0;}
.badge-complete{font-size:.72rem; font-weight:700; color:var(--accent); background:var(--card); padding:3px 10px; border-radius:999px;}
.slider-wrap{margin:18px 0;}
input[type=range]{width:100%; accent-color:var(--accent);}
.dayticks{display:flex; justify-content:space-between; font-size:.75rem; color:var(--ink-soft); margin-top:4px;}
.chainbox{display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:10px; border:1.5px dashed var(--line); border-radius:var(--radius-s); margin:10px 0;}
.chip{padding:6px 14px; border-radius:999px; background:var(--card); font-size:.85rem; font-weight:600; display:flex; align-items:center; gap:6px;}
.chip.picked{background:var(--accent); color:var(--white);}
.eventpick{padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius-s); background:var(--white); cursor:pointer; margin-bottom:8px;}
.eventpick:hover{border-color:var(--accent);}
.eventpick.used{opacity:.4; cursor:default;}
select{font-family:var(--font-body); font-size:.94rem; padding:10px 12px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--white); color:var(--ink); width:100%;}
.footer-nav{display:flex; justify-content:space-between; margin-top:28px; gap:10px;}
.loading{color:var(--ink-soft); font-style:italic; font-size:.9rem;}
.small{font-size:.85rem;}
.center{text-align:center;}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}
</style>
</head>

/* ============================= UTIL / SCORING ============================= */
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pct(n){ return Math.max(0,Math.min(100,Math.round(n))); }
function wordCount(t){ return (t||"").trim().split(/\s+/).filter(Boolean).length; }

function scoreSpot(selectedIdx, tl){
  const relevantIdx = tl.map((e,i)=>e.relevant?i:-1).filter(i=>i>=0);
  const relevantSet = new Set(relevantIdx);
  const hits = selectedIdx.filter(i=>relevantSet.has(i)).length;
  const falsePos = selectedIdx.filter(i=>!relevantSet.has(i)).length;
  let score = relevantIdx.length ? (hits/relevantIdx.length*100) : 0;
  score -= falsePos*8;
  return {score:pct(score), hits, total:relevantIdx.length, falsePos};
}
function scorePause(selected, correct){
  const cSet = new Set(correct);
  const hits = selected.filter(s=>cSet.has(s)).length;
  const fp = selected.filter(s=>!cSet.has(s)).length;
  let score = correct.length ? (hits/correct.length*100) : 0;
  score -= fp*8;
  return pct(score);
}
function scoreTurningPoint(chosenIdx, correctIdx){
  const diff = Math.abs(chosenIdx-correctIdx);
  if(diff===0) return 100; if(diff===1) return 55; return 20;
}
function scoreConnect(order, correctOrder){
  if(order.length<2) return 0;
  let matches=0;
  for(let i=0;i<order.length-1;i++){
    const a=order[i], b=order[i+1];
    const ci=correctOrder.indexOf(a), cj=correctOrder.indexOf(b);
    if(ci>=0 && cj===ci+1) matches++;
  }
  return pct(matches/(correctOrder.length-1)*100);
}
function scoreExplain(text, caseObj){
  const wc = wordCount(text);
  if(wc<4) return 0;
  const kw = [];
  Object.values(PATTERNS).forEach(p=>kw.push(p.name.toLowerCase()));
  ["rahasia","tekanan","percaya","pribadi","menjauh","spesial","kontrol","batas"].forEach(k=>kw.push(k));
  const lower=(text||"").toLowerCase();
  const hits = kw.filter(k=>lower.includes(k)).length;
  let rubric=1;
  if(wc>=10 && hits>=1) rubric=2;
  if(wc>=18 && hits>=2) rubric=3;
  return pct(rubric/3*100);
}
function avg(arr){ const a=arr.filter(n=>typeof n==="number"); return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }

function skillAverages(){
  const spots=[], connects=[], explains=[];
  if(S.preScores){ spots.push(S.preScores.spot); connects.push(S.preScores.connect); explains.push(S.preScores.explain); }
  Object.values(S.cases||{}).forEach(c=>{ if(c){ spots.push(c.spot); connects.push((c.turningPoint+c.connect)/2); explains.push(c.explain); } });
  return { spot: avg(spots), connect: avg(connects), explain: avg(explains) };
}

  postChainOrder=[];
  go("result");
}

};
let peniIdx=0, peniScore=0;
function renderPENI(){
  peniIdx=0; peniScore=0;
  showPENI();
}
function showPENI(){
  const area = document.getElementById("peniArea");
  if(!area) return;
  if(peniIdx>=NOT_ENOUGH_ITEMS.length){
    area.innerHTML = `<div class="feedbackbox good"><p>Selesai! Skor kamu: <strong>${peniScore}/${NOT_ENOUGH_ITEMS.length}</strong></p><button class="btn secondary small" onclick="renderPENI()">Ulangi</button></div>`;
    return;
  }
  const item = NOT_ENOUGH_ITEMS[peniIdx];
  area.innerHTML = `
    <div class="card white">
      <p style="font-style:italic;">"${item.text}"</p>
      <button class="btn secondary small" style="margin:4px 6px 4px 0;" onclick="answerPENI('a')">A. Pasti pola yang perlu diwaspadai</button>
      <button class="btn secondary small" style="margin:4px 6px 4px 0;" onclick="answerPENI('b')">B. Pasti aman</button>
      <button class="btn secondary small" style="margin:4px 6px 4px 0;" onclick="answerPENI('c')">C. Belum cukup informasi</button>
      <div id="peniFb"></div>
    </div>`;
}
function answerPENI(ans){
  const item = NOT_ENOUGH_ITEMS[peniIdx];
  const correct = ans===item.correct;
  if(correct) peniScore++;
  document.getElementById("peniFb").innerHTML = `<div class="feedbackbox ${correct?'good':'note'}" style="margin-top:12px;">
    <p style="font-weight:600; margin-bottom:4px;">${item.correct==='c' ? 'C. BELUM CUKUP INFORMASI' : (item.correct==='a'?'A. PERLU DIWASPADAI':'B. PASTI AMAN')}</p>
    <p class="small" style="margin:0;">Satu perilaku tidak selalu menjelaskan keseluruhan situasi. Perhatikan konteks, urutan kejadian, perubahan interaksi, dan kombinasi beberapa perilaku — bukan satu pesan saja.</p>
  </div><button class="btn accent small" style="margin-top:10px;" onclick="nextPENI()">Lanjut</button>`;
}
function nextPENI(){ peniIdx++; showPENI(); }

/* ============================= ADMIN ============================= */
SCREENS.admin = () => `
<div class="wrap-wide">
  <div class="eyebrow">Research Dashboard</div>
  <h2>Admin</h2>
  <div class="card white" id="adminGate" style="max-width:420px;">
    <p class="small muted">Masukkan kode akses peneliti untuk melihat data partisipan.</p>
    <input type="password" id="adminPass" placeholder="Kode akses">
    <button class="btn accent small" style="margin-top:10px;" onclick="adminEnter()">Masuk</button>
  </div>
  <div id="adminData"></div>
</div>`;
async function adminEnter(){
  const val = document.getElementById("adminPass").value;
  if(val!=="GROOMTRACE-ADMIN"){ document.getElementById("adminGate").insertAdjacentHTML("beforeend", `<p class="small" style="color:var(--danger); margin-top:8px;">Kode salah. (Demo: GROOMTRACE-ADMIN)</p>`); return; }
  document.getElementById("adminGate").style.display="none";
  const area = document.getElementById("adminData");
  area.innerHTML = `<p class="loading">Memuat data partisipan…</p>`;
  const list = await listParticipants();
  window._adminList = list;
  if(!list.length){ area.innerHTML = `<p class="muted">Belum ada data partisipan.</p>`; return; }
  const withBoth = list.filter(p=>p.pre&&p.post);
  const avgPre = withBoth.length? avg(withBoth.map(p=>(p.pre.spot+p.pre.connect+p.pre.explain)/3)) : 0;
  const avgPost = withBoth.length? avg(withBoth.map(p=>(p.post.spot+p.post.connect+p.post.explain)/3)) : 0;
  area.innerHTML = `
    <div class="grid3" style="margin:20px 0;">
      <div class="card"><div class="eyebrow">PARTICIPANTS</div><h3 style="font-size:1.8rem;">${list.length}</h3></div>
      <div class="card"><div class="eyebrow">AVG PRE</div><h3 style="font-size:1.8rem;">${pct(avgPre)}</h3></div>
      <div class="card"><div class="eyebrow">AVG POST</div><h3 style="font-size:1.8rem;">${pct(avgPost)}</h3></div>
    </div>
    <table>
      <tr><th>Participant</th><th>Pre</th><th>Post</th><th>Improvement</th><th>Cases Done</th></tr>
      ${list.map(p=>{
        const pre = p.pre? pct((p.pre.spot+p.pre.connect+p.pre.explain)/3) : null;
        const post = p.post? pct((p.post.spot+p.post.connect+p.post.explain)/3) : null;
        const imp = (pre!==null&&post!==null) ? (post-pre) : null;
        return `<tr><td>${esc(p.code)}</td><td>${pre??"—"}</td><td>${post??"—"}</td><td>${imp===null?"—":(imp>=0?"+":"")+imp}</td><td>${Object.keys(p.cases||{}).length}/${CASES.length}</td></tr>`;
      }).join("")}
    </table>
    <button class="btn secondary small" style="margin-top:18px;" onclick="exportCSV()">Export CSV</button>
  `;
}
async function exportCSV(){
  const list = window._adminList||[];
  let csv = "participant_code,pre_spot,pre_connect,pre_explain,post_spot,post_connect,post_explain,cases_completed\n";
  list.forEach(p=>{
    csv += [p.code, p.pre?p.pre.spot.toFixed(1):"", p.pre?p.pre.connect.toFixed(1):"", p.pre?p.pre.explain.toFixed(1):"", p.post?p.post.spot.toFixed(1):"", p.post?p.post.connect.toFixed(1):"", p.post?p.post.explain.toFixed(1):"", Object.keys(p.cases||{}).length].join(",") + "\n";
  });
  if(DOWNLOADS){
    try{ await DOWNLOADS.save({filename:"groomtrace_data.csv", data:csv}); return; }catch(e){}
  }
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download="groomtrace_data.csv"; a.click();
}

(async function boot(){
  await initCapabilities();
  const saved = loadLocal();
  if(saved && saved.code){
    const p = await loadParticipant(saved.code);
    if(p){ S.participant=p; S.cases=p.cases||{}; S.preScores=p.pre||null; S.postScores=p.post||null; S.screen = p.pre ? "dashboard" : "pretest"; }

  render();
})();
